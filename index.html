<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khách sạn Vĩnh Long</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1><a href="index.html">Khách sạn Vĩnh Long</a></h1></header>

  <div class="container">
    <!-- Ô tìm kiếm -->
    <div class="box">
      <div class="row">
        <div><label>Tìm theo tên hoặc địa chỉ</label><input id="timkiem" placeholder="Ví dụ: Grand, Trưng Nữ Vương..."></div>
        <div><label>Khu vực</label><select id="khuvuc"></select></div>
        <div><label>Loại hình</label>
          <select id="loai">
            <option value="">Tất cả</option>
            <option>Khách sạn</option><option>Nhà nghỉ</option><option>Homestay</option>
          </select></div>
        <div><label>Sắp xếp</label>
          <select id="sapxep">
            <option value="sao">Đánh giá cao nhất</option>
            <option value="ten">Tên A–Z</option>
          </select></div>
      </div>
      <p id="ketqua"></p>
    </div>

    <div class="layout">
      <div class="trai" id="danhsach"></div>
      <div class="phai">
        <iframe id="bando" title="Bản đồ"></iframe>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
